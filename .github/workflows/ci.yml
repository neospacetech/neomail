name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  backend:
    name: Python backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Build the core wheel
        run: |
          python -m pip install "maturin>=1.9,<2"
          maturin build --release --locked -m engine/py/Cargo.toml -o engine/dist
      - name: Install the wheel and the backend
        run: |
          python -m pip install engine/dist/*.whl
          python -m pip install -e "backend[dev]"
      - name: Lint
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check
        working-directory: backend
        run: mypy
      - name: Test
        working-directory: backend
        run: pytest

  image:
    name: Backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f deploy/Dockerfile.backend -t neomail-backend:ci .
      - name: Smoke test
        run: |
          docker run -d --name backend -p 8000:8000 neomail-backend:ci
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/readyz && exit 0; sleep 1; done
          docker logs backend
          exit 1

  frontend:
    name: Frontend module
    runs-on: ubuntu-latest
    steps:
      # The frontend depends on neosuite-commons through `file:../../neosuite-commons/...`,
      # so both repositories are checked out side by side.
      - uses: actions/checkout@v4
        with:
          path: neomail
      - uses: actions/checkout@v4
        with:
          repository: neospacetech/neosuite-commons
          ref: ${{ vars.NEOSUITE_COMMONS_REF || 'main' }}
          path: neosuite-commons
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: neomail/frontend/package-lock.json
      - run: npm ci
        working-directory: neomail/frontend
      - run: npm run typecheck
        working-directory: neomail/frontend
