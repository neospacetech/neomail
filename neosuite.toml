[component]
name = "neomail"
kind = "product"
title = "NeoMail"
profiles = ["full"]

[build]
images = ["backend"]
packages = ["frontend"]

[contracts]
provides_types = ["neomail.Mailbox", "neomail.Thread", "neomail.Message"]
consumes_types = ["core.Event", "core.Person"]
emits = [
    "neomail.mailbox.created",
    "neomail.mailbox.updated",
    "neomail.message.received",
    "neomail.message.sent",
    "neomail.message.moved",
    "neomail.message.marked",
]
actions = [
    "neomail.message.send",
    "neomail.message.move",
    "neomail.message.mark",
    "neomail.smartsend.check",
]
depends_on = ["neodb>=0.1", "neostore>=0.1", "neomind>=0.1", "neoflow>=0.1", "neocalendar>=0.1"]

[runtime.backend]
ports = [{ name = "http", container = 8000, expose = "internal" }]
ingress = { host = "mail", path = "/" }
env_required = []
secrets = []
volumes = []
health = { live = "/healthz", ready = "/readyz", metrics = "/metrics" }
resources = { min_memory = "128Mi", min_cpu = "0.1" }

[lifecycle]
migrate = { command = ["neomail", "migrate", "apply"], reversible = false }
backup = { command = ["neomail", "backup", "/backup"], restore = ["neomail", "restore", "/backup"], consistency = "online" }
upgrade = { supports_from = "N-2-minors", downgrade = false }
