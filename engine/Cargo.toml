[workspace]
members = ["core", "py"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "AGPL-3.0-only"
repository = "https://github.com/neospacetech/neomail"

[workspace.dependencies]
neomail-core = { path = "core" }
pyo3 = { version = "0.29", features = ["abi3-py312"] }
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.120"

[profile.release]
lto = "thin"
codegen-units = 1
