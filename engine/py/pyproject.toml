[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "neomail-core"
description = "NeoMail domain logic (Rust) as a Python extension module."
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
]

[tool.maturin]
module-name = "neomail_core"
bindings = "pyo3"
strip = true
